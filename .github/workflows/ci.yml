name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  boundaries:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-boundaries.sh
      - name: Remote Link contract and device-name policy
        run: ./scripts/check-remote-link-contract.sh
      - name: Generated v2 contracts
        run: python3 scripts/generate-remote-access-types.py --check
      # The mobile app generates its Swift types from the same schemas and
      # vendors the copies it was generated from. This fails while the app
      # still speaks an older contract than the one in this commit, which is
      # what keeps a schema change from silently shipping past it.
      - name: Mobile contract drift
        run: python3 apps/LatchMobile/Tools/generate-contract.py --check --upstream .

  mobile:
    name: Mobile client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build owned transport XCFramework
        run: ./scripts/build-latch-transport-xcframework.sh
      - name: Test
        run: swift test --package-path apps/LatchMobile
      - name: Build the app
        run: |
          xcodebuild build \
            -project apps/LatchMobile/App/LatchMobile.xcodeproj \
            -scheme LatchMobile \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is the M1 target platform. Linux runs too — it is faster, it
        # catches accidental platform assumptions early, and M6 makes it a
        # supported target rather than a happy accident.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The latch integration suite locates the real daemon beside the latch
      # test binary. Build it explicitly so the parity gate cannot be skipped
      # by a package-scoped Cargo invocation or target-ordering accident.
      - name: Build latchd parity binary
        run: cargo build --locked --package latchd
      - name: Latchd kernel parity gate
        run: cargo test --locked --package latch --test latchd_kernel_e2e -- --test-threads=1
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Doc tests
        run: cargo test --workspace --doc

  dependency-audit:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-audit reads the workspace lockfile and the RustSec advisory DB.
      - name: Cargo audit (Rust workspace)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm audit (production dependencies)
        run: |
          for directory in services/control-plane services/relay packages/*; do
            (cd "$directory" && npm audit --omit=dev)
          done

  remote-link-security:
    name: Remote Link security gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rust proxy and loopback security tests
        run: |
          cargo test --locked --package latch --test security
          cargo test --locked --package latch remote_access::tests
          cargo test --locked --package latch loopback_gateway_rejects_duplicate_grant_headers
      - name: Relay containment tests
        working-directory: services/relay
        run: |
          npm ci
          node --experimental-strip-types --test --test-name-pattern=containment "src/**/*.test.ts"
      - name: Build owned transport XCFramework
        run: ./scripts/build-latch-transport-xcframework.sh
      - name: Desktop Remote Link security tests
        run: |
          swift test --package-path apps/LatchDesktop --filter RemoteAccessTests
          swift test --package-path apps/LatchDesktop --filter UpdaterTests
      - name: Mobile Remote Link security tests
        run: swift test --package-path apps/LatchMobile --filter GatewayTransportTests
