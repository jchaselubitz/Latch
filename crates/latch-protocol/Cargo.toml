[package]
name = "latch-protocol"
description = "Latch wire protocol: frame codec and control-message vocabulary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

# This crate is a leaf. It must not depend on `latch`, `latch-term`, any I/O
# runtime, or any Overlord type. It describes bytes on a wire and nothing else,
# because the same vocabulary has to ride a Unix socket (M1) and a WebSocket
# (M3/M4) without change.
[dependencies]
rmp-serde.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
