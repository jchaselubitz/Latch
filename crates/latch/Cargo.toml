[package]
name = "latch"
description = "Persistent terminal sessions on a private tmux kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "latch"
path = "src/main.rs"

[lib]
name = "latch"
path = "src/lib.rs"

# One authored binary drives one pinned, bundled tmux binary.
#
# Dependencies here are held to what CLI startup can afford: with an iTerm
# profile pointed at `latch`, every terminal window pays this cost.
[dependencies]
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# `libc` and `tempfile` are repeated here because an integration test is its own
# crate: it links the library target, not the library's dependency graph. The
# suite needs both directly — it signals process groups and builds throwaway
# `~/.latch` roots.
[dev-dependencies]
libc.workspace = true
proptest.workspace = true
tempfile.workspace = true
