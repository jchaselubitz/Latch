[workspace]
resolver = "2"
members = [
    "crates/latch",
]

[workspace.package]
version = "0.2608141121.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false
repository = "https://github.com/Cooperativ/Latch"

[workspace.dependencies]
# Third-party versions are pinned here so every crate agrees.
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
# The process plane is POSIX: `setsid`, PTY allocation, process groups, signals,
# and `SO_PEERCRED`/`LOCAL_PEERCRED` have no portable std equivalent.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal"] }

# Dev-only
proptest = "1"
tempfile = "3"

[profile.release]
# The iTerm profile decision (D2) means every terminal window pays CLI startup
# cost, so the release binary is optimized for size and start time.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
