[workspace]
resolver = "2"
members = [
    "crates/latch",
    "crates/latch-term",
    "crates/latchd",
    "crates/latch-transport",
    "crates/latch-transport-ffi",
    "crates/latch-transport-bindgen",
    "crates/latch-remote",
]

[workspace.package]
version = "0.2609101247.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false
repository = "https://github.com/Cooperativ/Latch"

[workspace.dependencies]
# Third-party versions are pinned here so every crate agrees.
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
# The process plane is POSIX: `setsid`, PTY allocation, process groups, signals,
# and `SO_PEERCRED`/`LOCAL_PEERCRED` have no portable std equivalent.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10.0"
thiserror = "2"
vt100 = "0.16"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal", "sync", "fs", "process"] }
uniffi = { version = "0.32.0", features = ["tokio"] }
uniffi-cli = { package = "uniffi", version = "0.32.0", features = ["cli"] }
mdns-sd = "0.11"
if-addrs = "0.13"
sha2 = "0.10"
security-framework = "3"
futures = "0.3"
native-tls = "0.2"
rand = "0.9"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "native-tls"] }
tokio-util = { version = "0.7", features = ["compat"] }
yamux = "0.14.0"
zeroize = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Dev-only
proptest = "1"
tempfile = "3"

[profile.release]
# The iTerm profile decision (D2) means every terminal window pays CLI startup
# cost, so the release binary is optimized for size and start time.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
