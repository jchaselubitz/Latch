[workspace]
resolver = "2"
members = [
    "crates/latch",
    "crates/latch-protocol",
    "crates/latch-term",
]

[workspace.package]
version = "0.2608101202.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false
repository = "https://github.com/Cooperativ/Latch"

[workspace.dependencies]
# Internal crates. `latch-protocol` and `latch-term` are leaves: they must not
# depend on each other or on `latch`. See docs/ARCHITECTURE_RULES.md.
latch-protocol = { path = "crates/latch-protocol" }
latch-term = { path = "crates/latch-term" }

# Third-party versions are pinned here so every crate agrees.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The process plane is POSIX: `setsid`, PTY allocation, process groups, signals,
# and `SO_PEERCRED`/`LOCAL_PEERCRED` have no portable std equivalent.
libc = "0.2"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
vt100 = "0.16"

# Dev-only
proptest = "1"
tempfile = "3"

[profile.release]
# The iTerm profile decision (D2) means every terminal window pays CLI startup
# cost, so the release binary is optimized for size and start time.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
